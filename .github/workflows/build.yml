name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      # Используем официальный образ с Java и Android SDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      # Обходим ошибку с watchdog и лицензиями
      - name: Patch and Prepare
        run: |
          # Удаляем watchdog из зависимостей flet
          pip install flet==0.24.1
          pip uninstall watchdog -y || true
          # Принимаем лицензии, чтобы Flutter не ругался
          yes | flutter doctor --android-licenses || true
          
      - name: Build APK
        env:
          API_URL: "http://192.168.3.75:8000"
        run: flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sport-life-apk
          path: build/**/*.apk
          if-no-files-found: error
