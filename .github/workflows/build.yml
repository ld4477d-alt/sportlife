name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          
      # Устанавливаем библиотеки Linux, чтобы Flutter был доволен
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev clang cmake ninja-build pkg-config
          
      # Принимаем лицензии Android SDK
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          
      - name: Install Flet (старая версия)
        run: pip install flet==0.24.1
        
      - name: Build APK
        env:
          API_URL: "http://192.168.3.75:8000"
        run: flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sport-life-apk
          path: build/**/*.apk
          if-no-files-found: error
