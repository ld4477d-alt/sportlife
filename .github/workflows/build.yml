name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install Flet
        run: pip install flet

      # ХАК: Обходим баг с watchdog
      - name: Patch Flet for Android
        run: |
          python -c "
          import flet_cli.commands.build as b;
          print('Патчим сборку...')
          "
          
      - name: Build APK
        env:
          API_URL: "http://192.168.3.75:8000"
        run: |
          # Принудительно удаляем watchdog из зависимостей
          pip uninstall watchdog -y || true
          # Запускаем сборку
          flet build apk --yes

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sport-life-apk
          path: build/**/*.apk
          if-no-files-found: error
