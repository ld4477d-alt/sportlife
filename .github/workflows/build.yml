name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Flet
        run: pip install flet==0.24.1

      - name: Build APK and Patch Gradle
        run: |
          # Запускаем Flet в фоне
          flet build apk & 
          FLET_PID=$!
          
          # Ждем, пока он создаст папку сборки
          echo "Ждем появления папки сборки..."
          while true; do
            BUILD_DIR=$(find /tmp -maxdepth 1 -name "flet_flutter_build_*" | head -n 1)
            if [ -n "$BUILD_DIR" ]; then
              echo "Нашли папку: $BUILD_DIR"
              break
            fi
            sleep 1
          done
          
          # Меняем Gradle на 8.14
          GRADLE_FILE="$BUILD_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/gradle-8.7/gradle-8.14/g' "$GRADLE_FILE"
            echo "✅ Gradle обновлен на 8.14"
          fi
          
          # Ждем, пока Flet закончит сборку
          wait $FLET_PID

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sport-life-apk
          path: build/**/*.apk
          if-no-files-found: error
