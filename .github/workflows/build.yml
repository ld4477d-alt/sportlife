name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Create Fake Watchdog
        run: |
          # Создаем фейковый пакет watchdog, чтобы Flet не пытался его скачать
          mkdir -p fake_watchdog
          echo "class Observer: pass" > fake_watchdog/__init__.py
          echo "from setuptools import setup; setup(name='watchdog', version='4.0.0', packages=['fake_watchdog'])" > fake_watchdog/setup.py
          pip install ./fake_watchdog
          
      - name: Install Flet
        run: pip install flet
        
      - name: Build APK
        env:
          API_URL: "http://192.168.3.75:8000"
        run: flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sport-life-apk
          path: build/**/*.apk
          if-no-files-found: error
