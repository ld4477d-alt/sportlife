name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Flet
        run: pip install flet
      - name: Build APK
        run: flet build apk --yes
        continue-on-error: true  # <--- НЕ ОСТАНАВЛИВАТЬСЯ ПРИ ОШИБКЕ
      
      # СКАЧИВАЕМ ВСЕ ЛОГИ, ЧТОБЫ ПОНЯТЬ ПРИЧИНУ
      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/
          if-no-files-found: warn
